name: pgvector

volumes:
  pgvector-data:

services:
  pgvector:
    image: pgvector/pgvector:pg16
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      # - ./init-db:/docker-entrypoint-initdb.d # Set POSTGRES_DB in .env instead to create the database
    env_file:
      - .env
    ports:
      # Ensure that only your IP can access this port
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      start_period: 10s
      interval: 5s
      timeout: 1s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped