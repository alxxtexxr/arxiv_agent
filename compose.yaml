name: arxiv-agent
volumes:
    postgres-data:
        driver: local
services:
    redis:
        image: redis:6
        healthcheck:
            test: redis-cli ping
            interval: 5s
            timeout: 1s
            retries: 5
    postgres:
        image: postgres:16
        volumes:
            - postgres-data:/var/lib/postgresql/data
        env_file:
            - .env
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: postgres
        healthcheck:
            test: pg_isready -U ${POSTGRES_USER}
            start_period: 10s
            timeout: 1s
            retries: 5
            interval: 5s
    arxiv-agent:
        image: alimtegar/arxiv-agent:latest
        volumes:
            # Mount the source code into the container so changes don't require rebuilding the image
            - .:/deps/arxiv_agent
        ports:
            - "8123:8000"
        depends_on:
            redis:
                condition: service_healthy
            postgres:
                condition: service_healthy
        env_file:
            - .env
        environment:
            REDIS_URI: redis://redis:6379
            DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable