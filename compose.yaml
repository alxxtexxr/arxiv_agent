name: arxiv-agent
volumes:
  postgres-data:
    driver: local
services:
  redis:
    image: redis:6
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 1s
      retries: 5
  postgres:
    image: pgvector/pgvector:pg16
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      start_period: 10s
      timeout: 1s
      retries: 5
      interval: 5s
  arxiv-agent:
    image: alimtegar/arxiv-agent:latest
    volumes:
      # Mount the source code into the container so changes don't require rebuilding the image
      - .:/deps/arxiv_agent
    ports:
      - "2024:8000"
    env_file:
      - .env.production
    environment:
      REDIS_URI: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy