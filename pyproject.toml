[project]
name = "arxiv-agent"
version = "0.0.1"
description = "A LangGraph AI agent that recommends arXiv papers for today or a specified date, based on bookmarked arXiv papers (personalized recommendations) or topics (query-based recommendations)."
authors = [
    { name = "alxxtexxr", email = "42492971+alxxtexxr@users.noreply.github.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "arxiv>=2.1",
    "fastembed>=0.8.0",
    "feedparser>=6.0.14",
    "flashrank>=0.2.10",
    "langchain>=1.3.14",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.0.0",
    "langgraph-api>=0.11.1",
    "langgraph-checkpoint-postgres>=3.1.0",
    "numpy>=2.4.6",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.0.1",
]


[project.optional-dependencies]
local-models = ["sentence-transformers>=5.7.0"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["arxiv_agent"]
[tool.setuptools.package-dir]
"arxiv_agent" = "src/arxiv_agent"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.14",
    "memray>=1.20.0",
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    "ruff>=0.8.2",
]
